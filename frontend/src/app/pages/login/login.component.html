<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="card shadow-lg login-card">
    <div class="card-header text-center py-4">
      <h4 class="mb-0"><i class="bi bi-car-front me-2"></i>Vehicle Management</h4>
    </div>
    <div class="card-body p-4">
      <div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="credentials.email"
            name="email"
            required
            placeholder="admin@teste.com"
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="credentials.senha"
            name="senha"
            required
            placeholder="••••••"
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="carregando"
        >
          <span *ngIf="carregando" class="spinner-border spinner-border-sm me-2"></span>
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
