trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pool: 
  name: Default

variables:
  - group: vehicle-cd-secrets   # Pipelines → Library → + Variable Group
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '8.0.x'
  - name: nodeVersion
    value: '20.x'
 
# ═══════════════════════════════════════════════════════════════
# STAGE 1 — BUILD & SECURITY SCAN
# ═══════════════════════════════════════════════════════════════
stages:
  - stage: Build
    displayName: '🔨 Build & Security'
    jobs:

      - job: BuildBackend
        displayName: 'Build .NET API'
        steps:
          - checkout: self
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK $(dotnetVersion)'
            inputs:
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: restore
              projects: '**/*.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build API'
            inputs:
              command: build
              projects: 'API/minimal-api.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Build Tests'
            inputs:
              command: build
              projects: 'Test/Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish API (para artefato)'
            inputs:
              command: publish
              projects: 'API/minimal-api.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/api'
              publishWebProjects: false

          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api-binaries
            displayName: 'Publicar binários da API'

          - publish: Test/bin/$(buildConfiguration)/net8.0
            artifact: test-binaries
            displayName: 'Publicar binários de testes'

      - job: BuildFrontend
        displayName: 'Build Angular Frontend'
        steps:
          - checkout: self
          - task: NodeTool@0
            displayName: 'Instalar Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - script: cd frontend && npm ci
            displayName: 'npm ci'

          - script: cd frontend && npm run build
            displayName: 'ng build'

          - publish: frontend/dist
            artifact: frontend-dist
            displayName: 'Publicar dist do Angular'

      - job: SecurityScan
        displayName: 'Semgrep Security Scan'
        steps:
          - checkout: self

          - script: pip install semgrep
            displayName: 'Instalar Semgrep'

          - powershell: |
              semgrep --config .semgrep.yml `
                      --json `
                      --output semgrep-custom-report.json `
                      API/ Test/
            displayName: 'Regras customizadas'
            continueOnError: true

          - powershell: |
              semgrep --config p/csharp `
                      --json `
                      --output semgrep-full-report.json `
                      API/ Test/
            displayName: 'Ruleset oficial p/csharp'
            continueOnError: true

          - powershell: |
              $results = Get-Content semgrep-custom-report.json | ConvertFrom-Json
              $blocking = $results.results | Where-Object {
                $_.extra.severity -in @('HIGH', 'CRITICAL', 'ERROR')
              }
              if ($blocking) {
                Write-Host "❌ $($blocking.Count) vulnerabilidade(s) HIGH/CRITICAL encontrada(s):"
                $blocking | ForEach-Object { Write-Host "  $($_.check_id) -> $($_.path):$($_.start.line)" }
                exit 1
              }
              Write-Host "✅ Nenhuma vulnerabilidade HIGH/CRITICAL encontrada."
            displayName: '🚨 Quality Gate — bloquear em HIGH/CRITICAL'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar relatórios Semgrep'
            inputs:
              pathToPublish: '.'
              artifactName: 'semgrep-reports'
            condition: always()

  # ═══════════════════════════════════════════════════════════════
  # STAGE 2 — BUILD & PUSH DA IMAGEM DOCKER
  # Só roda na branch main, após os testes passarem
  # ═══════════════════════════════════════════════════════════════
  - stage: DockerBuild
    displayName: '🐳 Docker Build & Push'
    dependsOn: Build
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: BuildAndPushImage
        displayName: 'Build e push da imagem para ACR'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Login no Azure Container Registry'
            inputs:
              command: login
              containerRegistry: 'azure-vehicle-acr'   # Service Connection do tipo Docker Registry
                                                        # Crie em: Project Settings → Service Connections
                                                        # → New → Docker Registry → Azure Container Registry

          - task: Docker@2
            displayName: 'Build da imagem'
            inputs:
              command: build
              repository: 'vehicle-api'
              dockerfile: 'Dockerfile'
              # Tags: versão do build + latest para sempre ter a mais recente
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push para ACR'
            inputs:
              command: push
              repository: 'vehicle-api'
              tags: |
                $(Build.BuildId)
                latest

  # ═══════════════════════════════════════════════════════════════
  # STAGE 3 — DEPLOY (Continuous Delivery)
  # Backend → Azure Container Apps
  # Frontend → Azure Static Web Apps
  # ═══════════════════════════════════════════════════════════════
  - stage: Deploy
    displayName: '🚀 Deploy'
    dependsOn: DockerBuild
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:

      # ─── Backend: Azure Container Apps ───────────────────────
      - job: DeployBackend
        displayName: 'Deploy API → Container Apps'
        steps:
          - checkout: self
          
          - task: AzureCLI@2
            displayName: 'Atualizar imagem no Container App'
            inputs:
              azureSubscription: 'azure-vehicle-connection'
              scriptType: batch
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update --name "$(CONTAINER_APP_NAME)" --resource-group "$(RESOURCE_GROUP)" --image "$(ACR_LOGIN_SERVER)/vehicle-api:$(Build.BuildId)"

          - task: AzureCLI@2
            displayName: 'Atualizar variáveis de ambiente'
            inputs:
              azureSubscription: 'azure-vehicle-connection'
              scriptType: batch
              scriptLocation: inlineScript
              inlineScript: | 
                setlocal enabledelayedexpansion
                set "CONN_STRING=$(NEON_CONNECTION_STRING)"
                az containerapp update --name "$(CONTAINER_APP_NAME)" --resource-group "$(RESOURCE_GROUP)" --set-env-vars "ConnectionStrings__Postgresql=!CONN_STRING!" "Jwt__Key=$(JWT_KEY)" "ASPNETCORE_ENVIRONMENT=Production"
              
          - task: AzureCLI@2
            displayName: '✅ Smoke test'
            inputs:
              azureSubscription: 'azure-vehicle-connection'
              scriptType: batch
              scriptLocation: inlineScript
              inlineScript: |
                for /f "tokens=*" %%i in ('az containerapp show --name "$(CONTAINER_APP_NAME)" --resource-group "$(RESOURCE_GROUP)" --query "properties.configuration.ingress.fqdn" -o tsv') do set FQDN=%%i
                echo Smoke test: https://%FQDN%/

      # ─── Frontend: Azure Static Web Apps ─────────────────────
      - job: DeployFrontend
        displayName: 'Deploy Angular → Static Web Apps'
        steps:
          - download: current
            artifact: frontend-dist
            displayName: 'Baixar dist do Angular'

          - task: AzureCLI@2
            displayName: 'Deploy para Azure Static Web Apps'
            inputs:
              azureSubscription: 'azure-vehicle-connection'
              scriptType: batch
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name staticwebapp --yes
                az staticwebapp deploy --name "$(SWA_NAME)" --resource-group "$(RESOURCE_GROUP)" --source "$(Pipeline.Workspace)/frontend-dist/frontend/browser" --deployment-token "$(SWA_DEPLOYMENT_TOKEN)" --no-build
                
  # ═══════════════════════════════════════════════════════════════
  # STAGE 4 — PUBLISH ARTIFACTS (somente main, após deploy OK)
  # ═══════════════════════════════════════════════════════════════
  - stage: Publish
    displayName: '📦 Publish Artifacts'
    dependsOn: Deploy
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: PublishArtifacts
        displayName: 'Promover artefatos para release'
        steps:
          - checkout: self

          - download: current
            artifact: api-binaries
            displayName: 'Baixar binários da API'

          - download: current
            artifact: frontend-dist
            displayName: 'Baixar dist do Angular'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar API para release'
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/api-binaries'
              artifactName: 'api-release'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar frontend para release'
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/frontend-dist'
              artifactName: 'frontend-release'