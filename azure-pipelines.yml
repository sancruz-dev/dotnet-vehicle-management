trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  nodeVersion: '20.x'

# ═══════════════════════════════════════════════════════════════
# STAGE 1 — BUILD & SECURITY SCAN
# Os três jobs rodam em paralelo: backend, frontend e Semgrep.
# ═══════════════════════════════════════════════════════════════
stages:
  - stage: Build
    displayName: '🔨 Build & Security'
    jobs:

      # ─────────────────────────────────────────────────────────
      # JOB 1: Build do backend e publicação do binário
      # ─────────────────────────────────────────────────────────
      - job: BuildBackend
        displayName: 'Build .NET API'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK $(dotnetVersion)'
            inputs:
              version: $(dotnetVersion)

          - task: Cache@2
            displayName: 'Cache NuGet'
            inputs:
              key: 'nuget | "$(Agent.OS)" | API/minimal-api.csproj | Test/Test.csproj'
              path: $(NUGET_PACKAGES)
              restoreKeys: nuget | "$(Agent.OS)"

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: restore
              projects: '**/*.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build API'
            inputs:
              command: build
              projects: 'API/minimal-api.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Build Tests'
            inputs:
              command: build
              projects: 'Test/Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Publica os binários compilados para o stage de testes
          # usar pipeline artifacts (não Build Artifacts) garante
          # que o próximo stage pode baixar sem configuração extra.
          - task: DotNetCoreCLI@2
            displayName: 'Publish API (para artefato)'
            inputs:
              command: publish
              projects: 'API/minimal-api.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/api'
              publishWebProjects: false

          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api-binaries
            displayName: 'Publicar binários da API'

          # O binário de testes também é publicado para o stage Test
          - publish: Test/bin/$(buildConfiguration)/net8.0
            artifact: test-binaries
            displayName: 'Publicar binários de testes'

      # ─────────────────────────────────────────────────────────
      # JOB 2: Build do frontend Angular
      # ─────────────────────────────────────────────────────────
      - job: BuildFrontend
        displayName: 'Build Angular Frontend'
        steps:
          - task: NodeTool@0
            displayName: 'Instalar Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache node_modules'
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              path: frontend/node_modules
              restoreKeys: npm | "$(Agent.OS)"

          - script: |
              cd frontend && npm ci
            displayName: 'npm ci'

          - script: |
              cd frontend && npm run build
            displayName: 'ng build'

          - publish: frontend/dist
            artifact: frontend-dist
            displayName: 'Publicar dist do Angular'

      # ─────────────────────────────────────────────────────────
      # JOB 3: Análise de segurança com Semgrep
      # Roda em paralelo — não depende do build.
      # ─────────────────────────────────────────────────────────
      - job: SecurityScan
        displayName: 'Semgrep Security Scan'
        steps:
          - script: pip install semgrep
            displayName: 'Instalar Semgrep'

          - script: |
              semgrep --config .semgrep.yml \
                      --json \
                      --output semgrep-custom-report.json \
                      API/ Test/ || true
            displayName: 'Regras customizadas'

          - script: |
              semgrep --config p/csharp \
                      --json \
                      --output semgrep-full-report.json \
                      API/ Test/ || true
            displayName: 'Ruleset oficial p/csharp'

          # Quality gate: bloqueia se encontrar HIGH ou CRITICAL
          # Usa python inline para não depender de arquivo externo.
          - script: |
              python3 - <<'EOF'
              import json, sys

              with open('semgrep-custom-report.json') as f:
                  results = json.load(f)

              blocking = [
                  r for r in results.get('results', [])
                  if r.get('extra', {}).get('severity', '').upper()
                  in ('HIGH', 'CRITICAL', 'ERROR')
              ]

              if blocking:
                  print(f"❌ {len(blocking)} vulnerabilidade(s) HIGH/CRITICAL encontrada(s):")
                  for v in blocking:
                      print(f"   {v['check_id']} → {v['path']}:{v['start']['line']}")
                  sys.exit(1)

              print("✅ Nenhuma vulnerabilidade HIGH/CRITICAL encontrada.")
              EOF
            displayName: '🚨 Quality Gate — bloquear em HIGH/CRITICAL'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar relatórios Semgrep'
            inputs:
              pathToPublish: '.'
              artifactName: 'semgrep-reports'
            condition: always()

  # ═══════════════════════════════════════════════════════════════
  # STAGE 2 — TESTES UNITÁRIOS
  # Baixa os binários já compilados — não recompila nada.
  # Roda apenas TestCategory=Unit (sem dependência de banco de dados).
  # ═══════════════════════════════════════════════════════════════
  - stage: UnitTests
    displayName: '🧪 Unit Tests'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: RunUnitTests
        displayName: 'Executar testes unitários'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              version: $(dotnetVersion)

          # Baixa os binários de teste publicados no stage anterior
          - download: current
            artifact: test-binaries
            displayName: 'Baixar binários de testes'

          # Roda apenas os testes com [TestCategory("Unit")]
          # Isso exclui AdminServiceTest (Integration) que precisa de banco
          - task: DotNetCoreCLI@2
            displayName: 'dotnet test — Category=Unit'
            inputs:
              command: test
              projects: 'Test/Test.csproj'
              arguments: >
                --configuration $(buildConfiguration)
                --filter "TestCategory=Unit"
                --collect:"XPlat Code Coverage"
                --results-directory $(Agent.TempDirectory)/TestResults
                --logger trx

          - task: PublishTestResults@2
            displayName: 'Publicar resultados dos testes'
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: $(Agent.TempDirectory)/TestResults
            condition: always()

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura de código'
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
              codecoverageTool: Cobertura
            condition: always()

          # Quality gate de cobertura usando a task nativa do Azure
          # em vez de Python com glob frágil
          - task: BuildQualityChecks@9
            displayName: '🚨 Quality Gate — cobertura ≥ 60%'
            inputs:
              checkCoverage: true
              coverageFailOption: fixed
              coverageType: lines
              coverageThreshold: 60
            # Nota: 60% é realista para o projeto atual.
            # Aumente gradualmente conforme adicionar testes.

  # ═══════════════════════════════════════════════════════════════
  # STAGE 3 — PUBLICAR ARTEFATOS (somente na branch main)
  # ═══════════════════════════════════════════════════════════════
  - stage: Publish
    displayName: '📦 Publish Artifacts'
    dependsOn: UnitTests
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: PublishArtifacts
        displayName: 'Promover artefatos para release'
        steps:
          # Reutiliza o binário já publicado — não recompila
          - download: current
            artifact: api-binaries
            displayName: 'Baixar binários da API'

          - download: current
            artifact: frontend-dist
            displayName: 'Baixar dist do Angular'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar API para release'
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/api-binaries'
              artifactName: 'api-release'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar frontend para release'
            inputs:
              pathToPublish: '$(Pipeline.Workspace)/frontend-dist'
              artifactName: 'frontend-release'