trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'
  nodeVersion: '20.x'

stages:
  # ═══════════════════════════════════════════════════
  # STAGE 1: BUILD & SECURITY SCAN
  # ═══════════════════════════════════════════════════
  - stage: Build
    displayName: 'Build & Security'
    jobs:
      - job: BuildBackend
        displayName: 'Build .NET API'
        steps:
          # Setup .NET
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)

          # Cache NuGet packages
          - task: Cache@2
            displayName: 'Cache NuGet packages'
            inputs:
              key: 'nuget | "$(Agent.OS)" | API/minimal-api.csproj | Test/Test.csproj'
              path: $(NUGET_PACKAGES)
              restoreKeys: |
                nuget | "$(Agent.OS)"

          # Restore dependencies
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

          # Build API
          - task: DotNetCoreCLI@2
            displayName: 'Build API'
            inputs:
              command: 'build'
              projects: 'API/minimal-api.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Build Tests
          - task: DotNetCoreCLI@2
            displayName: 'Build Tests'
            inputs:
              command: 'build'
              projects: 'Test/Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

      - job: BuildFrontend
        displayName: 'Build Angular Frontend'
        steps:
          # Setup Node.js
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          # Cache node_modules
          - task: Cache@2
            displayName: 'Cache node_modules'
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              path: frontend/node_modules
              restoreKeys: |
                npm | "$(Agent.OS)"

          # Install dependencies
          - script: |
              cd frontend
              npm ci
            displayName: 'Install NPM dependencies'

          # Build frontend
          - script: |
              cd frontend
              npm run build
            displayName: 'Build Angular app'

      - job: SecurityScan
        displayName: 'Semgrep Security Scan'
        dependsOn: []  # Roda em paralelo
        steps:
          # Install Semgrep
          - script: |
              pip install semgrep
            displayName: 'Install Semgrep'

          # Run Semgrep with custom rules
          - script: |
              semgrep --config .semgrep.yml --json --output semgrep-results.json API/ Test/ || true
            displayName: 'Run Semgrep custom rules'

          # Run Semgrep official C# rules
          - script: |
              semgrep --config p/csharp --json --output semgrep-csharp.json API/ Test/ || true
            displayName: 'Run Semgrep C# ruleset'

          # Parse and fail on HIGH/CRITICAL
          - script: |
              python3 << 'EOF'
              import json
              import sys

              with open('semgrep-results.json') as f:
                  results = json.load(f)

              high_critical = [r for r in results.get('results', []) 
                               if r.get('extra', {}).get('severity') in ['HIGH', 'CRITICAL', 'ERROR']]

              if high_critical:
                  print(f"❌ Found {len(high_critical)} HIGH/CRITICAL vulnerabilities!")
                  for vuln in high_critical:
                      print(f"  - {vuln['check_id']} at {vuln['path']}:{vuln['start']['line']}")
                  sys.exit(1)
              else:
                  print("✅ No HIGH/CRITICAL vulnerabilities found")
              EOF
            displayName: '🚨 Quality Gate: Block on vulnerabilities'

          # Publish Semgrep results
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Semgrep reports'
            inputs:
              pathToPublish: '.'
              artifactName: 'semgrep-reports'
            condition: always()

  # ═══════════════════════════════════════════════════
  # STAGE 2: TEST & QUALITY GATES
  # ═══════════════════════════════════════════════════
  - stage: Test
    displayName: 'Test & Quality Gates'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: UnitTests
        displayName: 'Run Unit Tests'
        steps:
          # Setup .NET
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: $(dotnetVersion)

          # Restore cache
          - task: Cache@2
            displayName: 'Restore NuGet cache'
            inputs:
              key: 'nuget | "$(Agent.OS)" | API/minimal-api.csproj | Test/Test.csproj'
              path: $(NUGET_PACKAGES)

          # Restore
          - task: DotNetCoreCLI@2
            displayName: 'Restore packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

          # Run tests with coverage
          - task: DotNetCoreCLI@2
            displayName: 'Run tests with coverage'
            inputs:
              command: 'test'
              projects: 'Test/Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/TestResults'

          # Publish test results
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(Agent.TempDirectory)/TestResults'
            condition: always()

          # Publish code coverage
          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
              codecoverageTool: 'Cobertura'
            condition: always()

          # Quality Gate: Minimum 80% coverage
          - script: |
              python3 << 'EOF'
              import xml.etree.ElementTree as ET
              import glob
              import sys

              coverage_files = glob.glob('$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml', recursive=True)
              if not coverage_files:
                  print("⚠️  No coverage file found")
                  sys.exit(0)

              tree = ET.parse(coverage_files[0])
              root = tree.getroot()
              line_rate = float(root.attrib.get('line-rate', 0)) * 100

              print(f"📊 Code Coverage: {line_rate:.2f}%")
              
              if line_rate < 80:
                  print(f"❌ Coverage {line_rate:.2f}% is below 80% threshold!")
                  sys.exit(1)
              else:
                  print(f"✅ Coverage {line_rate:.2f}% meets 80% threshold")
              EOF
            displayName: '🚨 Quality Gate: Coverage >= 80%'
            condition: always()

  # ═══════════════════════════════════════════════════
  # STAGE 3: PUBLISH ARTIFACTS (opcional)
  # ═══════════════════════════════════════════════════
  - stage: Publish
    displayName: 'Publish Artifacts'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: PublishArtifacts
        displayName: 'Publish Build Artifacts'
        steps:
          # Setup .NET
          - task: UseDotNet@2
            inputs:
              version: $(dotnetVersion)

          # Publish API
          - task: DotNetCoreCLI@2
            displayName: 'Publish API'
            inputs:
              command: 'publish'
              projects: 'API/minimal-api.csproj'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api'
              publishWebProjects: false

          # Publish artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish API artifacts'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)/api'
              artifactName: 'api-drop'